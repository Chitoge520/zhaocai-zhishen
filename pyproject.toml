[project]
name = "zhaocai-zhishen"
version = "0.3.0"
description = "招采智审：面向招投标审计的无监督异常线索发现系统"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1.2",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
ocr-cpu = [
  "rapidocr-onnxruntime>=1.4.0",
  "pillow>=10.0.0",
]
ocr-gpu = [
  "paddleocr>=3.0.0",
  "pymupdf>=1.24.0",
]

[project.scripts]
zhaocai-zhishen = "zhaocai_zhishen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
